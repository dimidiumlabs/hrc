name: Authenticate GitHub downloads
description: Provide a temporary NETRC for GitHub downloads and remove it after the job
inputs:
  token:
    description: GitHub token used for downloads
    required: true
    default: ${{ github.token }}
runs:
  using: node24
  main: main.mjs
  post: post.mjs
  post-if: always()
