name: CI

on:
  push:
    branches: [main, "release/*"]
    tags: ["release-[0-9]*"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: sh

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/github-download-auth
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-version: "1.x"

      - uses: jdx/mise-action@v5.2.8
        with:
          # renovate: depName=jdx/mise
          version: v2026.10.17
          sha256: fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a
          working_directory: tools
          cache: false
          add_shims_to_path: false

      - name: Lint GitHub Actions
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh-actions-lock --verify --fail-on-warning --no-interactive

          bazel build //tools/check:shellcheck
          jactionlint --profile default --strict-exit --format github --online=strict --shellcheck "$PWD/bazel-bin/tools/check/shellcheck"

      - name: Check licenses
        run: bazel run //tools:reuse -- --root "$GITHUB_WORKSPACE" lint

      - name: Check formatting
        run: bazel test //:format --test_output=errors

      - name: Lint repository
        run: bazel test //:lint --test_output=errors

  build:
    needs: [preflight]
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        include:
          - os: linux
            runner: ubuntu-latest
          - os: darwin
            runner: macos-15
          - os: windows
            runner: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/github-download-auth
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-version: "1.x"

      - id: build
        env:
          BAZEL_SH: ${{ matrix.os == 'windows' && 'C:/Program Files/Git/bin/bash.exe' || 'bash' }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          # Git Bash matches prefixes of whole arguments, including option names.
          MSYS2_ARG_CONV_EXCL: "//;--platforms="
        run: |
          bazel build //cmd:release --platforms="//tools:${TARGET_OS}_${TARGET_ARCH}" --jobs=2

          target=$(tar -xOf bazel-bin/cmd/release.tar.gz ./TARGET)
          target=$(printf '%s' "$target" | tr -d '\r\n')
          [ "$target" = "$TARGET_ARCH-$TARGET_OS" ]

          version=$(awk '$1 == "STABLE_HRC_VERSION" { print $2 }' bazel-out/stable-status.txt)
          : "${version:?Missing STABLE_HRC_VERSION}"

          archive="hrc-$target-$version.tar.gz"

          mkdir -p dist/release
          cp bazel-bin/cmd/release.tar.gz "dist/release/$archive"
          cd dist/release

          if command -v sha256sum >/dev/null; then
            digest=$(sha256sum --binary "$archive")
          else
            digest=$(shasum -a 256 --binary "$archive")
          fi

          printf '%s  %s\n' "${digest%% *}" "$archive" > "SHASUMS256-$TARGET_ARCH-$TARGET_OS.txt"
          printf '%s\n' "$version" > VERSION
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          bazel test //:tests --test_output=errors

      - name: Attest build archives
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/release-'))
        uses: actions/attest@v4.2.2
        with:
          subject-checksums: dist/release/SHASUMS256-${{ matrix.arch }}-${{ matrix.os }}.txt
          create-storage-record: false

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: build-${{ matrix.arch }}-${{ matrix.os }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: [build]
    concurrency:
      group: publish-${{ github.repository }}-${{ github.ref == 'refs/heads/main' && 'dev' || 'stable' }}
      cancel-in-progress: false
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/release-'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/github-download-auth
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-version: "1.x"

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
          path: dist/release

      - name: Verify and publish release
        run: sh tools/release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_PUBLIC_URL: ${{ vars.S3_PUBLIC_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

          HRC_VERSION: ${{ needs.build.outputs.version }}
