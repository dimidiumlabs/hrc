name: Audit Dependencies

on:
  schedule:
    # Daily at 04:00 UTC, away from the busiest start-of-hour period.
    - cron: '00 4 * * *'

  push:
    branches: [main]
    paths:
      - .github/workflows/dependencies.yml
      - .github/renovate.json5
      - tools/renovate/**
      - tools/mise.toml
      - tools/mise.lock

  # Refresh the dashboard after a Renovate update is merged. Run the trusted
  # base-branch workflow only; never check out or execute the PR's code.
  # Closed/merged same-repo bot PRs only; the job executes the trusted default branch.
  pull_request_target: # jactionlint ignore=dangerous-triggers
    types: [closed]

  # Ticking a dashboard checkbox edits the issue body; see the job guard.
  issues:
    types: [edited]

  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview changes without creating branches, PRs, or issues
        type: boolean
        default: true

defaults:
  run:
    shell: sh

permissions:
  contents: read

concurrency:
  group: aduit-dependencies
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate (${{ inputs.dry-run && 'dry-run' || 'apply' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Ignore the bot's own dashboard edits to avoid a loop. PR events count
    # only for merged, same-repository Renovate branches targeting the default
    # branch; closing an unmerged PR or a fork PR must not start Renovate.
    if: >-
      vars.ROBOT_APP_ID != '' &&
      (
        github.event_name != 'issues' ||
        (
          github.event.issue.title == 'Dependency Dashboard' &&
          github.event.sender.type != 'Bot'
        )
      ) &&
      (
        github.event_name != 'pull_request_target' ||
        (
          github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == github.event.repository.default_branch &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.type == 'Bot' &&
          startsWith(github.event.pull_request.head.ref, 'renovate/')
        )
      )
    steps:
      # Always execute trusted default-branch code, including pull_request_target.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: $/.github/actions/github-download-auth
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-version: '1.x'

      # Install the lock generator and mise CLI, but not the CI linters.
      - uses: jdx/mise-action@v5.2.8
        with:
          version: v2026.11.7
          sha256: 8f5426d9971eaf713b37509749174ca69cf2f08b8b25e389168dcfcab9cd1a4d
          working_directory: tools
          install_args: --locked github:github/gh-actions-lock
          cache: false
          add_shims_to_path: false

      - name: Find available Node runtime updates
        id: node
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/renovate/node.sh catalog >> "$GITHUB_OUTPUT"

      # Provision before creating the write-capable App token. No npm lifecycle
      # scripts or network extension installation are allowed by this setup.
      - name: Prepare standalone Renovate
        run: sh tools/renovate/setup.sh "$RUNNER_TEMP/hrc-renovate"
        env:
          RENOVATE_CUSTOM_ENV_VARIABLES: ${{ steps.node.outputs.environment }}

      - name: Create installation token
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.ROBOT_APP_ID }}
          private-key: ${{ secrets.ROBOT_APP_PRIVATE_KEY }}

          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

          # Scope the token to exactly what Renovate needs, even if the App
          # installation ever grows broader permissions. `statuses` is load-
          # bearing: minimumReleaseAge works via commit statuses on update
          # branches, and without it Renovate aborts right after pushing
          # ("Integration unauthorized").
          permission-checks: write
          permission-statuses: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Run Renovate
        run: exec renovate
        env:
          LOG_LEVEL: debug
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_BASE_DIR: ${{ runner.temp }}/renovate-work
          RENOVATE_BINARY_SOURCE: global
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_ONBOARDING: 'false'
          # Only versions with both musl builds and rules_nodejs support may be proposed.
          RENOVATE_PACKAGE_RULES: ${{ steps.node.outputs.rules }}
          RENOVATE_REQUIRE_CONFIG: required
          # Allow only the repository's dispatcher with one subcommand, without
          # a shell executor. The dispatcher rejects unknown subcommands.
          RENOVATE_ALLOWED_COMMANDS: '["^tools/renovate/cmd\\.sh [a-z][a-z-]*$"]'
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || '' }}
